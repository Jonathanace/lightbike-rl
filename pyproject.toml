[project]
name = "lightbike-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dm-tree>=0.1.10",
    "gymnasium>=1.2.2",
    "lz4>=4.4.5",
    "opencv-python>=4.13.0.92",
    "opencv-python-headless>=5.0.0.93",
    "pettingzoo>=1.26.1",
    "pillow>=12.2.0",
    "ray[rllib]>=2.55.1",
    "rllib>=0.0.1",
    "sb3-contrib>=2.9.0",
    "scipy>=1.17.1",
    "stable-baselines3[extra]>=2.9.0",
    "streamlit>=1.59.2",
    "streamlit-shortcuts>=1.2.1",
    "supersuit>=3.10.0",
    "tensorboard>=2.21.0",
    "torch>=2.12.0",
    "wandb>=0.27.0",
]
[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["lightbike_rl*"]
